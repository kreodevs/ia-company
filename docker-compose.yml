# Auto-Company Platform — Docker Compose for Dokploy
#
# Deploy: import this compose file in Dokploy → Compose → paste or link repo
# Set all variables from .env.production.example in Dokploy Environment tab

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auto_company}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-auto_company}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auto_company} -d ${POSTGRES_DB:-auto_company}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-auto_company}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-auto_company}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      WORKSPACE_ROOT: /app
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SHELL_TIMEOUT_MS: ${SHELL_TIMEOUT_MS:-30000}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-tokenlab}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-3-5-sonnet-20241022}
      DEFAULT_TEMPERATURE: ${DEFAULT_TEMPERATURE:-0.7}
      TOKENLAB_API_KEY: ${TOKENLAB_API_KEY:-}
      TOKENLAB_BASE_URL: ${TOKENLAB_BASE_URL:-https://api.lemondata.io/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - workspace_data:/app/projects
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    entrypoint: ["node", "dist/worker/index.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-auto_company}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-auto_company}?schema=public
      REDIS_URL: redis://redis:6379
      WORKSPACE_ROOT: /app
      SHELL_TIMEOUT_MS: ${SHELL_TIMEOUT_MS:-30000}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-tokenlab}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-3-5-sonnet-20241022}
      DEFAULT_TEMPERATURE: ${DEFAULT_TEMPERATURE:-0.7}
      TOKENLAB_API_KEY: ${TOKENLAB_API_KEY:-}
      TOKENLAB_BASE_URL: ${TOKENLAB_BASE_URL:-https://api.lemondata.io/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - workspace_data:/app/projects
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "import('ioredis').then(m=>new m.Redis(process.env.REDIS_URL).ping().then(()=>process.exit(0)).catch(()=>process.exit(1)))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  workspace_data:
