server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # API is routed directly by Traefik → api:3001
    # No proxy needed here; nginx only serves the SPA static files.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
